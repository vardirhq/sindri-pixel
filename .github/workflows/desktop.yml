name: Desktop

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'sindri-pixel-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing sindri-pixel-v* tag to publish when running manually
        required: false
        type: string

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build frontend
        run: pnpm check
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native bundles
        run: pnpm tauri:build
      - name: Upload native bundles
        uses: actions/upload-artifact@v4
        with:
          name: sindri-pixel-${{ runner.os }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/sindri-pixel-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download native bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$RELEASE_TAG" == *-* ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease --title "Sindri Pixel $RELEASE_TAG"
            else
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Sindri Pixel $RELEASE_TAG"
            fi
          fi
          while IFS= read -r -d '' asset; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done < <(find artifacts -type f -print0)
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
